services:
  - type: web
    name: olivepinch-backend
    runtime: node
    rootDir: server
    plan: free
    region: frankfurt
    buildCommand: npm install --include=dev && npx prisma migrate deploy && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: WORLDPAY_USERNAME
        sync: false
      - key: WORLDPAY_PASSWORD
        sync: false
      - key: WORLDPAY_ENTITY
        sync: false
      - key: WORLDPAY_API_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: APP_URL
        sync: false
      - key: CRON_SECRET
        sync: false

  - type: cron
    name: olivepinch-daily-sweep
    runtime: node
    plan: free
    region: frankfurt
    schedule: "0 7 * * *"
    buildCommand: "true"
    startCommand: 'curl -fsS -X POST -H "Authorization: Bearer $CRON_SECRET" "$SWEEP_URL"'
    envVars:
      - key: SWEEP_URL
        value: https://olivepinch-backend-0cca.onrender.com/api/internal/daily-sweep
      - key: CRON_SECRET
        sync: false
