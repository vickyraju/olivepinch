name: OlivePinch daily sweep

on:
  schedule:
    # 07:00 UTC daily — off the top of the hour to avoid GitHub's scheduling pile-up.
    - cron: "0 7 * * *"
  workflow_dispatch: {}

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - name: Call /api/internal/daily-sweep
        run: |
          curl -sf -X POST "https://olivepinch-backend-0cca.onrender.com/api/internal/daily-sweep" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
